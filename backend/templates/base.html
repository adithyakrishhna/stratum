<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Stratum{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0d1117; color: #c9d1d9; min-height: 100vh;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 2rem 2.5rem; width: 100%; max-width: 420px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f0f6fc; }
    p  { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem;
           padding: 0.6rem 1.2rem; border-radius: 6px; border: none;
           cursor: pointer; font-size: 0.95rem; text-decoration: none;
           font-weight: 500; transition: opacity .15s; }
    .btn:hover { opacity: 0.85; }
    .btn-github { background: #238636; color: #fff; }
    .btn-logout { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem;
             font-size: 0.875rem; }
    .alert-error { background: #3d1f1f; border: 1px solid #f85149; color: #f85149; }
    .logo { font-size: 1.1rem; font-weight: 700; color: #58a6ff;
            letter-spacing: -0.5px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
