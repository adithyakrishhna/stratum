{% extends "base.html" %}

{% block title %}Sign out — Stratum{% endblock %}

{% block content %}
<div class="card">
  <div class="logo">⬡ Stratum</div>
  <h1>Sign out</h1>
  <p>Are you sure you want to sign out?</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-logout">Yes, sign me out</button>
  </form>
</div>
{% endblock %}
